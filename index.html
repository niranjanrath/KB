<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knowledge Vault - Local-First Markdown Knowledge Base</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        vault: {
                            50: '#f4f4f6',
                            100: '#e6e6eb',
                            200: '#d0d0d9',
                            300: '#adaebf',
                            400: '#83849e',
                            500: '#636480',
                            600: '#4d4e68',
                            700: '#3d3e54',
                            800: '#262736',
                            900: '#191a24',
                            950: '#0f1017'
                        },
                        accent: {
                            DEFAULT: '#6366f1',
                            hover: '#4f46e5',
                            light: '#818cf8'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
                        mono: ['Fira Code', 'JetBrains Mono', 'Consolas', 'monospace']
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Dexie.js CDN -->
    <script src="https://unpkg.com/dexie@3.2.4/dist/dexie.js"></script>
    <!-- Marked.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- DOMPurify CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.5/purify.min.js"></script>
    <!-- JSZip CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    
    <style>
        /* Custom scrollbars */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.3);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(156, 163, 175, 0.5);
        }
        
        /* Markdown Preview Styles */
        .markdown-rendered h1 { font-size: 1.875rem; font-weight: 700; margin-top: 1.5rem; margin-bottom: 0.75rem; border-bottom: 1px solid rgba(156, 163, 175, 0.2); padding-bottom: 0.3rem; }
        .markdown-rendered h2 { font-size: 1.5rem; font-weight: 600; margin-top: 1.25rem; margin-bottom: 0.5rem; border-bottom: 1px solid rgba(156, 163, 175, 0.15); padding-bottom: 0.2rem; }
        .markdown-rendered h3 { font-size: 1.25rem; font-weight: 600; margin-top: 1rem; margin-bottom: 0.5rem; }
        .markdown-rendered h4 { font-size: 1.1rem; font-weight: 600; margin-top: 0.75rem; margin-bottom: 0.25rem; }
        .markdown-rendered p { margin-bottom: 0.85rem; line-height: 1.6; }
        .markdown-rendered ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 0.85rem; }
        .markdown-rendered ol { list-style-type: decimal; padding-left: 1.5rem; margin-bottom: 0.85rem; }
        .markdown-rendered li { margin-bottom: 0.25rem; }
        .markdown-rendered blockquote { border-left: 4px solid #6366f1; padding-left: 1rem; margin-left: 0; margin-right: 0; margin-bottom: 0.85rem; opacity: 0.85; font-style: italic; }
        .markdown-rendered code { font-family: 'Fira Code', 'JetBrains Mono', monospace; background: rgba(156, 163, 175, 0.15); padding: 0.15rem 0.35rem; border-radius: 0.25rem; font-size: 0.875em; }
        .markdown-rendered pre { background: #111827; color: #f3f4f6; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; margin-bottom: 1rem; }
        .markdown-rendered pre code { background: transparent; padding: 0; font-size: 0.875rem; }
        .markdown-rendered table { width: 100%; border-collapse: collapse; margin-bottom: 1rem; }
        .markdown-rendered th, .markdown-rendered td { border: 1px solid rgba(156, 163, 175, 0.3); padding: 0.5rem 0.75rem; text-align: left; }
        .markdown-rendered th { background: rgba(156, 163, 175, 0.1); font-weight: 600; }
        .markdown-rendered a { color: #6366f1; text-decoration: underline; }
        .markdown-rendered a:hover { color: #4f46e5; }
        .markdown-rendered hr { border: 0; border-top: 1px solid rgba(156, 163, 175, 0.3); margin: 1.5rem 0; }
        .markdown-rendered input[type="checkbox"] { margin-right: 0.5rem; accent-color: #6366f1; }

        /* Drag & Drop Feedback Styles */
        .drag-over {
            background-color: rgba(99, 102, 241, 0.2) !important;
            border: 2px dashed #6366f1 !important;
        }
    </style>
</head>
<body class="bg-vault-50 text-vault-900 dark:bg-vault-950 dark:text-vault-100 min-h-screen font-sans flex flex-col antialiased overflow-hidden">

    <!-- App Header / Navbar -->
    <header class="h-14 bg-white dark:bg-vault-900 border-b border-vault-200 dark:border-vault-800 flex items-center justify-between px-4 z-20 shrink-0">
        <div class="flex items-center space-x-3">
            <button id="mobile-sidebar-toggle" class="md:hidden text-vault-600 dark:text-vault-400 hover:text-vault-900 dark:hover:text-vault-100 p-2 rounded-lg focus:outline-none">
                <i class="fa-solid fa-bars text-lg"></i>
            </button>
            <div class="flex items-center space-x-2">
                <div class="w-8 h-8 rounded-lg bg-indigo-600 text-white flex items-center justify-center font-bold text-lg shadow-md">
                    <i class="fa-solid fa-brain"></i>
                </div>
                <span class="font-bold text-lg tracking-tight hidden sm:inline">Vault<span class="text-indigo-500">.md</span></span>
            </div>
            <span class="text-xs bg-indigo-100 dark:bg-indigo-900/50 text-indigo-700 dark:text-indigo-300 px-2 py-0.5 rounded-full font-medium hidden sm:inline">Local-First</span>
        </div>

        <!-- Global Quick Actions -->
        <div class="flex items-center space-x-2">
            <button id="btn-new-note-global" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1.5 rounded-lg text-sm font-medium flex items-center space-x-1.5 shadow-sm transition-colors">
                <i class="fa-solid fa-plus text-xs"></i>
                <span class="hidden sm:inline">New Note</span>
            </button>

            <!-- Import / Export Dropdown -->
            <div class="relative group">
                <button class="bg-vault-100 dark:bg-vault-800 hover:bg-vault-200 dark:hover:bg-vault-700 text-vault-700 dark:text-vault-200 px-3 py-1.5 rounded-lg text-sm font-medium flex items-center space-x-1 transition-colors">
                    <i class="fa-solid fa-file-import text-xs"></i>
                    <span class="hidden md:inline">Data</span>
                    <i class="fa-solid fa-chevron-down text-[10px] ml-1"></i>
                </button>
                <div class="absolute right-0 top-full mt-1 w-48 bg-white dark:bg-vault-800 rounded-lg shadow-xl border border-vault-200 dark:border-vault-700 py-1 hidden group-hover:block z-50">
                    <button id="btn-import-file" class="w-full text-left px-4 py-2 text-sm text-vault-700 dark:text-vault-200 hover:bg-vault-100 dark:hover:bg-vault-700 flex items-center space-x-2">
                        <i class="fa-solid fa-file-arrow-up w-4 text-indigo-500"></i>
                        <span>Import .md File</span>
                    </button>
                    <button id="btn-import-zip" class="w-full text-left px-4 py-2 text-sm text-vault-700 dark:text-vault-200 hover:bg-vault-100 dark:hover:bg-vault-700 flex items-center space-x-2">
                        <i class="fa-solid fa-file-zipper w-4 text-amber-500"></i>
                        <span>Import ZIP Archive</span>
                    </button>
                    <button id="btn-import-json" class="w-full text-left px-4 py-2 text-sm text-vault-700 dark:text-vault-200 hover:bg-vault-100 dark:hover:bg-vault-700 flex items-center space-x-2">
                        <i class="fa-solid fa-code w-4 text-emerald-500"></i>
                        <span>Restore JSON Backup</span>
                    </button>
                    <hr class="my-1 border-vault-200 dark:border-vault-700">
                    <button id="btn-export-zip" class="w-full text-left px-4 py-2 text-sm text-vault-700 dark:text-vault-200 hover:bg-vault-100 dark:hover:bg-vault-700 flex items-center space-x-2">
                        <i class="fa-solid fa-file-zipper w-4 text-indigo-500"></i>
                        <span>Export All (ZIP)</span>
                    </button>
                    <button id="btn-export-json" class="w-full text-left px-4 py-2 text-sm text-vault-700 dark:text-vault-200 hover:bg-vault-100 dark:hover:bg-vault-700 flex items-center space-x-2">
                        <i class="fa-solid fa-download w-4 text-emerald-500"></i>
                        <span>Export JSON Backup</span>
                    </button>
                </div>
            </div>

            <!-- Dark Theme Toggle -->
            <button id="theme-toggle" class="p-2 text-vault-600 dark:text-vault-400 hover:text-vault-900 dark:hover:text-vault-100 rounded-lg bg-vault-100 dark:bg-vault-800 transition-colors">
                <i class="fa-solid fa-moon dark:hidden"></i>
                <i class="fa-solid fa-sun hidden dark:inline"></i>
            </button>
        </div>
    </header>

    <!-- Hidden Input elements for imports -->
    <input type="file" id="input-import-md" accept=".md,.markdown" class="hidden">
    <input type="file" id="input-import-zip" accept=".zip" class="hidden">
    <input type="file" id="input-import-json" accept=".json" class="hidden">

    <!-- Main Workspace Area -->
    <div class="flex-1 flex overflow-hidden relative">

        <!-- Mobile Drawer Overlay -->
        <div id="mobile-overlay" class="fixed inset-0 bg-black/50 z-20 hidden md:hidden"></div>

        <!-- Sidebar (Hierarchical Knowledge Tree & Search) -->
        <aside id="sidebar" class="w-80 bg-vault-100/70 dark:bg-vault-900/90 border-r border-vault-200 dark:border-vault-800 flex flex-col h-full absolute md:relative z-30 transition-transform duration-300 -translate-x-full md:translate-x-0 shrink-0">
            <!-- Search Bar -->
            <div class="p-3 border-b border-vault-200 dark:border-vault-800">
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-xs text-vault-400"></i>
                    <input type="text" id="search-input" placeholder="Search notes & content..." class="w-full pl-9 pr-8 py-1.5 text-sm bg-white dark:bg-vault-800 border border-vault-200 dark:border-vault-700 rounded-lg text-vault-900 dark:text-vault-100 placeholder-vault-400 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <button id="search-clear" class="hidden absolute right-2.5 top-2 text-xs text-vault-400 hover:text-vault-600 dark:hover:text-vault-200">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
            </div>

            <!-- Sidebar Actions Bar -->
            <div class="px-3 py-2 flex items-center justify-between border-b border-vault-200/60 dark:border-vault-800/60 text-xs font-semibold text-vault-500 dark:text-vault-400">
                <span>EXPLORER</span>
                <div class="flex items-center space-x-1">
                    <button id="btn-add-root-folder" title="New Root Folder" class="p-1 hover:bg-vault-200 dark:hover:bg-vault-800 rounded transition-colors">
                        <i class="fa-solid fa-folder-plus text-vault-600 dark:text-vault-300"></i>
                    </button>
                    <button id="btn-expand-all" title="Expand All" class="p-1 hover:bg-vault-200 dark:hover:bg-vault-800 rounded transition-colors">
                        <i class="fa-solid fa-angles-down text-vault-600 dark:text-vault-300"></i>
                    </button>
                    <button id="btn-collapse-all" title="Collapse All" class="p-1 hover:bg-vault-200 dark:hover:bg-vault-800 rounded transition-colors">
                        <i class="fa-solid fa-angles-up text-vault-600 dark:text-vault-300"></i>
                    </button>
                </div>
            </div>

            <!-- Tree View Container -->
            <div id="tree-container" class="flex-1 overflow-y-auto p-2 space-y-0.5">
                <!-- Knowledge Tree rendered dynamically here -->
            </div>

            <!-- Search Results Container (Hidden by default) -->
            <div id="search-results-container" class="flex-1 overflow-y-auto p-2 hidden">
                <div id="search-results-list" class="space-y-1"></div>
            </div>

            <!-- Storage Indicator Footer -->
            <div class="p-3 border-t border-vault-200 dark:border-vault-800 text-xs text-vault-500 dark:text-vault-400 flex items-center justify-between">
                <span class="flex items-center space-x-1">
                    <i class="fa-solid fa-database text-emerald-500"></i>
                    <span>IndexedDB Local</span>
                </span>
                <span id="note-count-badge" class="bg-vault-200 dark:bg-vault-800 px-2 py-0.5 rounded-full text-[10px] font-semibold">0 notes</span>
            </div>
        </aside>

        <!-- Main Content Area (Editor / Preview) -->
        <main class="flex-1 flex flex-col bg-white dark:bg-vault-950 h-full overflow-hidden relative">
            
            <!-- Empty State View (Shown when no note selected) -->
            <div id="empty-state" class="flex-1 flex flex-col items-center justify-center p-6 text-center">
                <div class="w-16 h-16 bg-indigo-50 dark:bg-indigo-950/50 rounded-2xl flex items-center justify-center text-indigo-500 mb-4 text-2xl shadow-inner">
                    <i class="fa-solid fa-book-open"></i>
                </div>
                <h2 class="text-xl font-bold mb-2 text-vault-800 dark:text-vault-200">No Note Selected</h2>
                <p class="text-sm text-vault-500 dark:text-vault-400 max-w-sm mb-6">Select a Markdown note from the sidebar tree, or create a new note to start capturing knowledge locally.</p>
                <div class="flex items-center space-x-3">
                    <button id="btn-empty-new-note" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center space-x-2 shadow transition-colors">
                        <i class="fa-solid fa-plus text-xs"></i>
                        <span>Create New Note</span>
                    </button>
                </div>
            </div>

            <!-- Active Note Editor & View Container -->
            <div id="editor-container" class="flex-1 flex flex-col h-full hidden">
                
                <!-- Note Top Toolbar -->
                <div class="h-12 border-b border-vault-200 dark:border-vault-800 flex items-center justify-between px-4 bg-vault-50/50 dark:bg-vault-900/40 shrink-0">
                    
                    <!-- Left: Breadcrumb & Title Edit -->
                    <div class="flex items-center space-x-2 min-w-0 flex-1 mr-4">
                        <i class="fa-regular fa-file-lines text-indigo-500 shrink-0"></i>
                        <div id="breadcrumb-path" class="text-xs text-vault-400 truncate hidden sm:block">Knowledge Base /</div>
                        <input type="text" id="note-title-input" class="bg-transparent border-b border-transparent hover:border-vault-300 dark:hover:border-vault-700 focus:border-indigo-500 focus:bg-white dark:focus:bg-vault-800 px-1.5 py-0.5 text-sm font-semibold text-vault-900 dark:text-vault-100 rounded focus:outline-none transition-colors truncate w-full max-w-md" placeholder="Untitled Note">
                    </div>

                    <!-- Right: Save status, View Toggles & Actions -->
                    <div class="flex items-center space-x-3 shrink-0">
                        <!-- Autosave Indicator -->
                        <div id="save-indicator" class="text-xs text-vault-400 flex items-center space-x-1.5">
                            <span class="w-2 h-2 rounded-full bg-emerald-500 inline-block"></span>
                            <span id="save-status-text" class="hidden sm:inline">Saved</span>
                        </div>

                        <!-- View Mode Toggles -->
                        <div class="bg-vault-200 dark:bg-vault-800 p-0.5 rounded-lg flex items-center text-xs font-medium">
                            <button id="btn-view-edit" title="Edit View" class="px-2.5 py-1 rounded-md transition-all">Edit</button>
                            <button id="btn-view-split" title="Split View" class="px-2.5 py-1 rounded-md transition-all bg-white dark:bg-vault-700 shadow-sm text-indigo-600 dark:text-indigo-300">Split</button>
                            <button id="btn-view-preview" title="Preview View" class="px-2.5 py-1 rounded-md transition-all">Preview</button>
                        </div>

                        <!-- More Note Actions -->
                        <div class="relative group">
                            <button class="p-1.5 text-vault-500 hover:text-vault-800 dark:hover:text-vault-200 rounded-lg hover:bg-vault-200 dark:hover:bg-vault-800 transition-colors">
                                <i class="fa-solid fa-ellipsis-vertical"></i>
                            </button>
                            <div class="absolute right-0 top-full mt-1 w-44 bg-white dark:bg-vault-800 rounded-lg shadow-xl border border-vault-200 dark:border-vault-700 py-1 hidden group-hover:block z-50">
                                <button id="btn-export-single-md" class="w-full text-left px-3 py-1.5 text-xs text-vault-700 dark:text-vault-200 hover:bg-vault-100 dark:hover:bg-vault-700 flex items-center space-x-2">
                                    <i class="fa-solid fa-download text-indigo-500 w-4"></i>
                                    <span>Export .md</span>
                                </button>
                                <button id="btn-delete-current-note" class="w-full text-left px-3 py-1.5 text-xs text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-950/40 flex items-center space-x-2">
                                    <i class="fa-regular fa-trash-can w-4"></i>
                                    <span>Delete Note</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Editor Body Workspace -->
                <div class="flex-1 flex overflow-hidden relative">
                    
                    <!-- Text Area Markdown Editor -->
                    <div id="editor-wrapper" class="flex-1 h-full border-r border-vault-200 dark:border-vault-800 flex flex-col bg-white dark:bg-vault-950">
                        <textarea id="markdown-textarea" class="w-full h-full p-4 font-mono text-sm leading-relaxed bg-transparent text-vault-900 dark:text-vault-100 resize-none focus:outline-none" placeholder="Start typing Markdown content here..."></textarea>
                    </div>

                    <!-- Live Rendered Markdown Preview -->
                    <div id="preview-wrapper" class="flex-1 h-full overflow-y-auto p-6 bg-vault-50/30 dark:bg-vault-950 markdown-rendered">
                        <div id="markdown-preview" class="max-w-3xl mx-auto"></div>
                    </div>
                </div>

                <!-- Note Footer Stats -->
                <div class="h-7 border-t border-vault-200 dark:border-vault-800 px-4 flex items-center justify-between text-[11px] text-vault-400 bg-vault-50/80 dark:bg-vault-900/80 shrink-0">
                    <div class="flex items-center space-x-4">
                        <span id="stat-words">0 words</span>
                        <span id="stat-chars">0 characters</span>
                    </div>
                    <div id="stat-updated">Last modified: -</div>
                </div>

            </div>
        </main>
    </div>

    <!-- Generic Confirmation Modal -->
    <div id="confirm-modal" class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 hidden backdrop-blur-sm">
        <div class="bg-white dark:bg-vault-800 rounded-xl max-w-sm w-full p-5 shadow-2xl border border-vault-200 dark:border-vault-700">
            <h3 id="modal-title" class="text-base font-bold text-vault-900 dark:text-vault-100 mb-2">Confirm Action</h3>
            <p id="modal-message" class="text-xs text-vault-600 dark:text-vault-300 mb-5 leading-relaxed">Are you sure you want to proceed?</p>
            <div class="flex items-center justify-end space-x-2">
                <button id="modal-cancel" class="px-3 py-1.5 text-xs font-medium text-vault-600 dark:text-vault-300 hover:bg-vault-100 dark:hover:bg-vault-700 rounded-lg transition-colors">Cancel</button>
                <button id="modal-confirm" class="px-3 py-1.5 text-xs font-medium bg-red-600 hover:bg-red-700 text-white rounded-lg transition-colors">Delete</button>
            </div>
        </div>
    </div>

    <!-- MAIN APP JAVASCRIPT MODULE -->
    <script type="module">
        // ==========================================
        // 1. DEXIE INDEXEDDB SETUP & SEED DATA
        // ==========================================
        const db = new Dexie('KnowledgeBaseDB');
        db.version(1).stores({
            folders: '++id, name, parentId, createdAt, updatedAt',
            notes: '++id, title, folderId, content, createdAt, updatedAt'
        });

        // Seed default hierarchy if database is newly initialized
        async function seedInitialDataIfNeeded() {
            const folderCount = await db.folders.count();
            if (folderCount === 0) {
                const now = new Date().toISOString();
                
                // Root folders
                const archId = await db.folders.add({ name: 'Architecture', parentId: null, createdAt: now, updatedAt: now });
                const engId = await db.folders.add({ name: 'Engineering', parentId: null, createdAt: now, updatedAt: now });
                const secId = await db.folders.add({ name: 'Security', parentId: null, createdAt: now, updatedAt: now });
                const aiId = await db.folders.add({ name: 'AI & Data', parentId: null, createdAt: now, updatedAt: now });

                // Subfolders
                const patternsId = await db.folders.add({ name: 'Design Patterns', parentId: archId, createdAt: now, updatedAt: now });
                const javaId = await db.folders.add({ name: 'Java & Spring', parentId: engId, createdAt: now, updatedAt: now });
                const devopsId = await db.folders.add({ name: 'DevOps & CI-CD', parentId: engId, createdAt: now, updatedAt: now });

                // Notes
                await db.notes.add({
                    title: 'Software Architecture Overview',
                    folderId: archId,
                    content: `# Software Architecture\n\nSoftware architecture serves as the blueprint for both the system and the project developing it.\n\n## Key Architectural Principles\n- **Separation of Concerns**: Divide application into distinct features.\n- **Single Responsibility Principle**: Each module handles a single concern.\n- **DRY (Don't Repeat Yourself)**: Eliminate duplicate logic.\n\n### Checklist for System Review\n- [x] Scalability Analysis\n- [x] Security & Threat Modeling\n- [ ] Disaster Recovery Plan`,
                    createdAt: now,
                    updatedAt: now
                });

                await db.notes.add({
                    title: 'C4 Model',
                    folderId: archId,
                    content: `# The C4 Model for Visualizing Architecture\n\nCreated by Simon Brown, the C4 model helps teams describe software architecture at different levels of abstraction.\n\n| Level | Name | Description |\n| :--- | :--- | :--- |\n| 1 | System Context | High level view of users & system |\n| 2 | Container | High level tech choices & responsibilities |\n| 3 | Component | Internal component breakdown |\n| 4 | Code | Class and implementation level details |\n\n> "Good architecture enables fast feedback loops and safe evolution."`,
                    createdAt: now,
                    updatedAt: now
                });

                await db.notes.add({
                    title: 'Hexagonal Architecture',
                    folderId: patternsId,
                    content: `# Hexagonal Architecture (Ports and Adapters)\n\nAllows an application to be equally driven by users, programs, automated tests, or batch scripts, and to be developed and tested in isolation from runtime devices and databases.\n\n\`\`\`javascript\n// Core Domain Port\ninterface Repository {\n  findById(id: string): Promise<User>;\n}\n\`\`\``,
                    createdAt: now,
                    updatedAt: now
                });

                await db.notes.add({
                    title: 'Spring Boot Best Practices',
                    folderId: javaId,
                    content: `# Spring Boot Guidelines\n\n1. **Use Explicit Dependencies**: Prefer constructor injection over \`@Autowired\` field injection.\n2. **Stateless Services**: Ensure domain services maintain no mutable state.\n3. **Profile Configuration**: Isolate dev/prod properties cleanly.`,
                    createdAt: now,
                    updatedAt: now
                });

                await db.notes.add({
                    title: 'RAG & Vector Search',
                    folderId: aiId,
                    content: `# Retrieval-Augmented Generation (RAG)\n\nRAG combines pre-trained language models with external retrieval mechanisms to provide contextual domain knowledge.\n\n- **Chunking**: Break documents into logical segments.\n- **Embedding**: Generate dense vector embeddings.\n- **Vector Store**: Index vectors for fast cosine similarity search.`,
                    createdAt: now,
                    updatedAt: now
                });
            }
        }

        // ==========================================
        // 2. STATE MANAGEMENT & GLOBALS
        // ==========================================
        const state = {
            activeNoteId: null,
            activeFolderId: null,
            expandedFolders: new Set(),
            viewMode: 'split', // 'edit', 'split', 'preview'
            searchQuery: '',
            autosaveTimer: null,
            draggedItem: null // { type: 'note'|'folder', id: number }
        };

        // UI DOM Element Cache
        const DOM = {
            sidebar: document.getElementById('sidebar'),
            mobileSidebarToggle: document.getElementById('mobile-sidebar-toggle'),
            mobileOverlay: document.getElementById('mobile-overlay'),
            themeToggle: document.getElementById('theme-toggle'),
            treeContainer: document.getElementById('tree-container'),
            searchResultsContainer: document.getElementById('search-results-container'),
            searchResultsList: document.getElementById('search-results-list'),

            btnImportJson: document.getElementById('btn-import-json'),
            inputImportMd: document.getElementById('input-import-md'),

        // Configure Marked parser securely

        // ==========================================
        // 3. CORE LOGIC & RENDERERS
        // ==========================================

        // Initialize Application
        async function initApp() {
            await seedInitialDataIfNeeded();
            setupTheme();
            setupEventListeners();
            await refreshKnowledgeTree();
            setupServiceWorker();
        }

        // Theme Support
        function setupTheme() {
            const isDark = localStorage.getItem('theme') === 'dark' || 
                (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches);
            if (isDark) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        }

        DOM.themeToggle.addEventListener('click', () => {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        });

        // Mobile Sidebar Controls
        function toggleMobileSidebar(show) {
            if (show) {
                DOM.sidebar.classList.remove('-translate-x-full');
                DOM.mobileOverlay.classList.remove('hidden');
            } else {
                DOM.sidebar.classList.add('-translate-x-full');
                DOM.mobileOverlay.classList.add('hidden');
            }
        }

        DOM.mobileSidebarToggle.addEventListener('click', () => toggleMobileSidebar(true));
        DOM.mobileOverlay.addEventListener('click', () => toggleMobileSidebar(false));

        // Build Nested Folder Hierarchy
        async function refreshKnowledgeTree() {
            const folders = await db.folders.toArray();
            const notes = await db.notes.toArray();
            
            DOM.noteCountBadge.textContent = `${notes.length} note${notes.length === 1 ? '' : 's'}`;

            // Build folder parent-child map
            const folderMap = new Map();
            folders.forEach(f => folderMap.set(f.id, { ...f, children: [], notes: [] }));
            
            const rootFolders = [];
            folders.forEach(f => {
                if (f.parentId && folderMap.has(f.parentId)) {
                    folderMap.get(f.parentId).children.push(folderMap.get(f.id));
                } else {
                    rootFolders.push(folderMap.get(f.id));
                }
            });

            // Map notes to their respective folders
            const rootNotes = [];
            notes.forEach(n => {
                if (n.folderId && folderMap.has(n.folderId)) {
                    folderMap.get(n.folderId).notes.push(n);
                } else {
                    rootNotes.push(n);
                }
            });

            // Render DOM Tree
            DOM.treeContainer.innerHTML = '';
            
            // Render root notes if any
            rootNotes.forEach(note => {
                DOM.treeContainer.appendChild(renderNoteTreeItem(note, 0));
            });

            // Render root folders
            rootFolders.forEach(folder => {
                DOM.treeContainer.appendChild(renderFolderTreeItem(folder, 0));
            });

            if (folders.length === 0 && notes.length === 0) {
                DOM.treeContainer.innerHTML = `<div class="text-xs text-vault-400 p-3 text-center italic">Knowledge base is empty</div>`;
            }
        }

        // Render Folder Node
        function renderFolderTreeItem(folder, depth) {
            const container = document.createElement('div');
            container.className = 'select-none';

            const isExpanded = state.expandedFolders.has(folder.id);
            const isSelected = state.activeFolderId === folder.id;

            const folderRow = document.createElement('div');
            folderRow.className = `group flex items-center justify-between px-2 py-1.5 rounded-lg text-sm font-medium cursor-pointer transition-colors ${
                isSelected ? 'bg-indigo-100/70 dark:bg-indigo-950/60 text-indigo-700 dark:text-indigo-300' : 'hover:bg-vault-200/50 dark:hover:bg-vault-800/50 text-vault-700 dark:text-vault-300'
            }`;
            folderRow.style.paddingLeft = `${depth * 12 + 8}px`;
            folderRow.draggable = true;

            // Drag and Drop attributes
            folderRow.dataset.type = 'folder';
            folderRow.dataset.id = folder.id;

            folderRow.innerHTML = `
                <div class="flex items-center space-x-2 truncate flex-1 min-w-0">
                    <button class="toggle-folder focus:outline-none w-4 h-4 flex items-center justify-center text-vault-400 hover:text-vault-600 dark:hover:text-vault-200">
                        <i class="fa-solid fa-chevron-${isExpanded ? 'down' : 'right'} text-[10px]"></i>
                    </button>
                    <i class="fa-solid fa-folder${isExpanded ? '-open' : ''} text-amber-500 text-xs"></i>
                    <span class="truncate text-xs">${escapeHtml(folder.name)}</span>
                </div>
                <div class="opacity-0 group-hover:opacity-100 flex items-center space-x-1 text-xs text-vault-400">
                    <button class="btn-add-subnote p-1 hover:text-indigo-500" title="New Note in Folder"><i class="fa-solid fa-plus"></i></button>
                    <button class="btn-add-subfolder p-1 hover:text-indigo-500" title="New Subfolder"><i class="fa-solid fa-folder-plus"></i></button>
                    <button class="btn-rename-folder p-1 hover:text-indigo-500" title="Rename Folder"><i class="fa-solid fa-pen"></i></button>
                    <button class="btn-delete-folder p-1 hover:text-red-500" title="Delete Folder"><i class="fa-solid fa-trash"></i></button>
                </div>
            `;

            // Event Listeners for folder operations
            folderRow.addEventListener('click', (e) => {
                if (e.target.closest('button')) return;
                state.activeFolderId = folder.id;
                toggleFolderExpand(folder.id);
            });

            folderRow.querySelector('.toggle-folder').addEventListener('click', (e) => {
                e.stopPropagation();
                toggleFolderExpand(folder.id);
            });

            folderRow.querySelector('.btn-add-subnote').addEventListener('click', (e) => {
                e.stopPropagation();
                createNewNote(folder.id);
            });

            folderRow.querySelector('.btn-add-subfolder').addEventListener('click', (e) => {
                e.stopPropagation();
                promptCreateFolder(folder.id);
            });

            folderRow.querySelector('.btn-rename-folder').addEventListener('click', (e) => {
                e.stopPropagation();
                promptRenameFolder(folder);
            });

            folderRow.querySelector('.btn-delete-folder').addEventListener('click', (e) => {
                e.stopPropagation();
                confirmDeleteFolder(folder);
            });

            // Drag & Drop handlers
            setupDragAndDrop(folderRow, 'folder', folder.id);

            container.appendChild(folderRow);

            // Render children if expanded
            if (isExpanded) {
                const childrenContainer = document.createElement('div');
                
                // Render nested folders first
                folder.children.forEach(sub => {
                    childrenContainer.appendChild(renderFolderTreeItem(sub, depth + 1));
                });

                // Render folder notes
                folder.notes.forEach(note => {
                    childrenContainer.appendChild(renderNoteTreeItem(note, depth + 1));
                });

                if (folder.children.length === 0 && folder.notes.length === 0) {
                    const emptyItem = document.createElement('div');
                    emptyItem.className = 'text-[11px] text-vault-400 italic py-1';
                    emptyItem.style.paddingLeft = `${(depth + 1) * 12 + 24}px`;
                    emptyItem.textContent = 'Empty folder';
                    childrenContainer.appendChild(emptyItem);
                }

                container.appendChild(childrenContainer);
            }

            return container;
        }

        // Render Note Node
        function renderNoteTreeItem(note, depth) {
            const isSelected = state.activeNoteId === note.id;
            
            const noteRow = document.createElement('div');
            noteRow.className = `group flex items-center justify-between px-2 py-1.5 rounded-lg text-xs cursor-pointer transition-colors ${
                isSelected ? 'bg-indigo-600 text-white font-medium shadow-sm' : 'hover:bg-vault-200/50 dark:hover:bg-vault-800/50 text-vault-700 dark:text-vault-300'
            }`;
            noteRow.style.paddingLeft = `${depth * 12 + 24}px`;
            noteRow.draggable = true;
            noteRow.dataset.type = 'note';
            noteRow.dataset.id = note.id;

            noteRow.innerHTML = `
                <div class="flex items-center space-x-2 truncate flex-1 min-w-0">
                    <i class="fa-regular fa-file-lines ${isSelected ? 'text-white' : 'text-indigo-500'} text-xs"></i>
                    <span class="truncate">${escapeHtml(note.title || 'Untitled Note')}</span>
                </div>
                <div class="opacity-0 group-hover:opacity-100 flex items-center space-x-1">
                    <button class="btn-delete-note p-1 hover:text-red-300" title="Delete Note"><i class="fa-solid fa-xmark"></i></button>
                </div>
            `;

            noteRow.addEventListener('click', () => {
                openNote(note.id);
                if (window.innerWidth < 768) toggleMobileSidebar(false);
            });

            noteRow.querySelector('.btn-delete-note').addEventListener('click', (e) => {
                e.stopPropagation();
                confirmDeleteNote(note.id);
            });

            setupDragAndDrop(noteRow, 'note', note.id);

            return noteRow;
        }

        // Drag & Drop Handling for moving items between folders
        function setupDragAndDrop(element, type, id) {
            element.addEventListener('dragstart', (e) => {
                e.stopPropagation();
                state.draggedItem = { type, id };
                e.dataTransfer.setData('text/plain', JSON.stringify({ type, id }));
                element.classList.add('opacity-50');
            });

            element.addEventListener('dragend', () => {
                element.classList.remove('opacity-50');
                state.draggedItem = null;
            });

            if (type === 'folder') {
                element.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    element.classList.add('drag-over');
                });

                element.addEventListener('dragleave', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    element.classList.remove('drag-over');
                });

                element.addEventListener('drop', async (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    element.classList.remove('drag-over');

                    if (!state.draggedItem) return;
                    const { type: dragType, id: dragId } = state.draggedItem;

                    if (dragType === 'note') {
                        // Move note to target folder
                        await db.notes.update(dragId, { folderId: id, updatedAt: new Date().toISOString() });
                        await refreshKnowledgeTree();
                        if (state.activeNoteId === dragId) updateBreadcrumbPath();
                    } else if (dragType === 'folder' && dragId !== id) {
                        // Prevent recursive moving folder into self or descendant
                        const isDescendant = await checkIfFolderIsDescendant(id, dragId);
                        if (!isDescendant) {
                            await db.folders.update(dragId, { parentId: id, updatedAt: new Date().toISOString() });
                            await refreshKnowledgeTree();
                        }
                    }
                });
            }
        }

        async function checkIfFolderIsDescendant(targetFolderId, folderToMoveId) {
            let current = await db.folders.get(targetFolderId);
            while (current) {
                if (current.id === folderToMoveId) return true;
                if (!current.parentId) break;
                current = await db.folders.get(current.parentId);
            }
            return false;
        }

        // Folder Expand / Collapse state toggles
        function toggleFolderExpand(folderId) {
            if (state.expandedFolders.has(folderId)) {
                state.expandedFolders.delete(folderId);
            } else {
                state.expandedFolders.add(folderId);
            }
            refreshKnowledgeTree();
        }

        DOM.btnExpandAll.addEventListener('click', async () => {
            const folders = await db.folders.toArray();
            folders.forEach(f => state.expandedFolders.add(f.id));
            refreshKnowledgeTree();
        });

        DOM.btnCollapseAll.addEventListener('click', () => {
            state.expandedFolders.clear();
            refreshKnowledgeTree();
        });

        // ==========================================
        // 4. NOTE & FOLDER CRUD ACTIONS
        // ==========================================

        async function createNewNote(targetFolderId = null) {
            const folderId = targetFolderId !== null ? targetFolderId : state.activeFolderId;
            const now = new Date().toISOString();
            
            const newNoteId = await db.notes.add({
                title: 'Untitled Note',
                folderId: folderId,
                content: '# Untitled Note\n\nWrite your thoughts here...',
                createdAt: now,
                updatedAt: now
            });

            if (folderId) state.expandedFolders.add(folderId);
            await refreshKnowledgeTree();
            await openNote(newNoteId);
            DOM.noteTitleInput.focus();
            DOM.noteTitleInput.select();
        }

        DOM.btnNewNoteGlobal.addEventListener('click', () => createNewNote());
        DOM.btnEmptyNewNote.addEventListener('click', () => createNewNote());

        async function openNote(noteId) {
            state.activeNoteId = noteId;
            const note = await db.notes.get(noteId);
            if (!note) {
                showEmptyState();
                return;
            }

            DOM.emptyState.classList.add('hidden');
            DOM.editorContainer.classList.remove('hidden');

            DOM.noteTitleInput.value = note.title;
            DOM.markdownTextarea.value = note.content;

            updateBreadcrumbPath();
            renderMarkdownPreview();
            updateNoteStats();
            refreshKnowledgeTree();
        }

        function showEmptyState() {
            state.activeNoteId = null;
            DOM.editorContainer.classList.add('hidden');
            DOM.emptyState.classList.remove('hidden');
            refreshKnowledgeTree();
        }

        async function updateBreadcrumbPath() {
            if (!state.activeNoteId) return;
            const note = await db.notes.get(state.activeNoteId);
            if (!note) return;

            let path = [];
            let currentFolderId = note.folderId;

            while (currentFolderId) {
                const folder = await db.folders.get(currentFolderId);
                if (folder) {
                    path.unshift(folder.name);
                    currentFolderId = folder.parentId;
                } else {
                    break;
                }
            }

            path.unshift('Vault');
            DOM.breadcrumbPath.textContent = path.join(' / ') + ' /';
        }

        // Autosave Logic (~300ms Debounce)
        DOM.markdownTextarea.addEventListener('input', () => {
            renderMarkdownPreview();
            updateNoteStats();
            triggerAutosave();
        });

        DOM.noteTitleInput.addEventListener('input', () => {
            triggerAutosave();
        });

        function triggerAutosave() {
            setSaveStatus('Saving...', false);
            clearTimeout(state.autosaveTimer);
            state.autosaveTimer = setTimeout(async () => {
                await saveCurrentNote();
            }, 300);
        }

        async function saveCurrentNote() {
            if (!state.activeNoteId) return;
            const title = DOM.noteTitleInput.value.trim() || 'Untitled Note';
            const content = DOM.markdownTextarea.value;
            const now = new Date().toISOString();

            await db.notes.update(state.activeNoteId, {
                title,
                content,
                updatedAt: now
            });

            setSaveStatus('Saved', true);
            refreshKnowledgeTree();
        }

        function setSaveStatus(text, isSaved) {
            DOM.saveStatusText.textContent = text;
            DOM.saveIndicator.querySelector('span').className = `w-2 h-2 rounded-full inline-block ${isSaved ? 'bg-emerald-500' : 'bg-amber-500 animate-pulse'}`;
        }

        // Render Markdown Live Preview securely
        function renderMarkdownPreview() {
            const rawMarkdown = DOM.markdownTextarea.value;
            const rawHtml = marked.parse(rawMarkdown);
            // Sanitize rendered HTML using DOMPurify
            const cleanHtml = DOMPurify.sanitize(rawHtml);
            DOM.markdownPreview.innerHTML = cleanHtml;
        }

        function updateNoteStats() {
            const text = DOM.markdownTextarea.value;
            const words = text.trim() ? text.trim().split(/\s+/).length : 0;
            const chars = text.length;
            DOM.statWords.textContent = `${words} word${words === 1 ? '' : 's'}`;
            DOM.statChars.textContent = `${chars} character${chars === 1 ? '' : 's'}`;

            if (state.activeNoteId) {
                db.notes.get(state.activeNoteId).then(note => {
                    if (note) {
                        const date = new Date(note.updatedAt);
                        DOM.statUpdated.textContent = `Last modified: ${date.toLocaleDateString()} ${date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;
                    }
                });
            }
        }

        // Folder Operations
        async function promptCreateFolder(parentId = null) {
            const folderName = prompt('Enter folder name:');
            if (folderName && folderName.trim()) {
                const now = new Date().toISOString();
                const newId = await db.folders.add({
                    name: folderName.trim(),
                    parentId: parentId,
                    createdAt: now,
                    updatedAt: now
                });
                if (parentId) state.expandedFolders.add(parentId);
                state.expandedFolders.add(newId);
                refreshKnowledgeTree();
            }
        }

        DOM.btnAddRootFolder.addEventListener('click', () => promptCreateFolder(null));

        async function promptRenameFolder(folder) {
            const newName = prompt('Rename folder:', folder.name);
            if (newName && newName.trim() && newName.trim() !== folder.name) {
                await db.folders.update(folder.id, {
                    name: newName.trim(),
                    updatedAt: new Date().toISOString()
                });
                refreshKnowledgeTree();
                if (state.activeNoteId) updateBreadcrumbPath();
            }
        }

        async function confirmDeleteFolder(folder) {
            showModal(
                'Delete Folder',
                `Are you sure you want to delete "${folder.name}"? Subfolders and notes inside will also be permanently deleted.`,
                async () => {
                    await deleteFolderRecursive(folder.id);
                    refreshKnowledgeTree();
                    if (!await db.notes.get(state.activeNoteId)) {
                        showEmptyState();
                    }
                }
            );
        }

        async function deleteFolderRecursive(folderId) {
            // Delete all notes in this folder
            await db.notes.where('folderId').equals(folderId).delete();

            // Find and delete subfolders recursively
            const subfolders = await db.folders.where('parentId').equals(folderId).toArray();
            for (const sub of subfolders) {
                await deleteFolderRecursive(sub.id);
            }

            // Delete folder itself
            await db.folders.delete(folderId);
        }

        function confirmDeleteNote(noteId) {
            showModal(
                'Delete Note',
                'Are you sure you want to delete this Markdown note?',
                async () => {
                    await db.notes.delete(noteId);
                    if (state.activeNoteId === noteId) {
                        showEmptyState();
                    }
                    refreshKnowledgeTree();
                }
            );
        }

        DOM.btnDeleteCurrentNote.addEventListener('click', () => {
            if (state.activeNoteId) confirmDeleteNote(state.activeNoteId);
        });

        // View Mode Toggles (Edit, Split, Preview)
        function setViewMode(mode) {
            state.viewMode = mode;
            [DOM.btnViewEdit, DOM.btnViewSplit, DOM.btnViewPreview].forEach(btn => {
                btn.className = 'px-2.5 py-1 rounded-md transition-all text-vault-600 dark:text-vault-400';
            });

            if (mode === 'edit') {
                DOM.btnViewEdit.className = 'px-2.5 py-1 rounded-md transition-all bg-white dark:bg-vault-700 shadow-sm text-indigo-600 dark:text-indigo-300';
                DOM.editorWrapper.classList.remove('hidden');
                DOM.previewWrapper.classList.add('hidden');
            } else if (mode === 'preview') {
                DOM.btnViewPreview.className = 'px-2.5 py-1 rounded-md transition-all bg-white dark:bg-vault-700 shadow-sm text-indigo-600 dark:text-indigo-300';
                DOM.editorWrapper.classList.add('hidden');
                DOM.previewWrapper.classList.remove('hidden');
            } else {
                DOM.btnViewSplit.className = 'px-2.5 py-1 rounded-md transition-all bg-white dark:bg-vault-700 shadow-sm text-indigo-600 dark:text-indigo-300';
                DOM.editorWrapper.classList.remove('hidden');
                DOM.previewWrapper.classList.remove('hidden');
            }
        }

        DOM.btnViewEdit.addEventListener('click', () => setViewMode('edit'));
        DOM.btnViewSplit.addEventListener('click', () => setViewMode('split'));
        DOM.btnViewPreview.addEventListener('click', () => setViewMode('preview'));

        // ==========================================
        // 5. LOCAL SEARCH ENGINE
        // ==========================================
        DOM.searchInput.addEventListener('input', (e) => {
            const query = e.target.value.trim().toLowerCase();
            state.searchQuery = query;

            if (query.length > 0) {
                DOM.searchClear.classList.remove('hidden');
                DOM.treeContainer.classList.add('hidden');
                DOM.searchResultsContainer.classList.remove('hidden');
                performSearch(query);
            } else {
                clearSearch();
            }
        });

        DOM.searchClear.addEventListener('click', () => clearSearch());

        function clearSearch() {
            DOM.searchInput.value = '';
            state.searchQuery = '';
            DOM.searchClear.classList.add('hidden');
            DOM.searchResultsContainer.classList.add('hidden');
            DOM.treeContainer.classList.remove('hidden');
        }

        async function performSearch(query) {
            const notes = await db.notes.toArray();
            const folders = await db.folders.toArray();
            const folderMap = new Map(folders.map(f => [f.id, f.name]));

            const results = [];

            notes.forEach(note => {
                const titleMatch = note.title.toLowerCase().includes(query);
                const contentMatch = note.content.toLowerCase().includes(query);

                if (titleMatch || contentMatch) {
                    // Extract snippet if content matched
                    let snippet = '';
                    if (contentMatch) {
                        const idx = note.content.toLowerCase().indexOf(query);
                        const start = Math.max(0, idx - 30);
                        const end = Math.min(note.content.length, idx + 60);
                        snippet = '...' + note.content.substring(start, end).replace(/\n/g, ' ') + '...';
                    } else {
                        snippet = note.content.substring(0, 80).replace(/\n/g, ' ') + '...';
                    }

                    const folderName = note.folderId ? folderMap.get(note.folderId) || 'Unknown Folder' : 'Root';

                    results.push({
                        note,
                        folderName,
                        snippet
                    });
                }
            });

            renderSearchResults(results, query);
        }

        function renderSearchResults(results, query) {
            DOM.searchResultsList.innerHTML = '';

            if (results.length === 0) {
                DOM.searchResultsList.innerHTML = `<div class="text-xs text-vault-400 p-4 text-center">No matching notes found for "${escapeHtml(query)}"</div>`;
                return;
            }

            results.forEach(res => {
                const item = document.createElement('div');
                item.className = 'p-2.5 rounded-lg bg-white dark:bg-vault-800 border border-vault-200 dark:border-vault-700/60 hover:border-indigo-500 cursor-pointer transition-all mb-1.5 shadow-sm';
                item.innerHTML = `
                    <div class="flex items-center justify-between mb-1">
                        <span class="text-xs font-semibold text-vault-900 dark:text-vault-100 flex items-center space-x-1.5">
                            <i class="fa-regular fa-file-lines text-indigo-500"></i>
                            <span>${escapeHtml(res.note.title)}</span>
                        </span>
                        <span class="text-[10px] bg-vault-100 dark:bg-vault-700 text-vault-500 dark:text-vault-300 px-1.5 py-0.5 rounded">${escapeHtml(res.folderName)}</span>
                    </div>
                    <p class="text-[11px] text-vault-500 dark:text-vault-400 line-clamp-2 leading-snug">${escapeHtml(res.snippet)}</p>
                `;

                item.addEventListener('click', () => {
                    openNote(res.note.id);
                    if (res.note.folderId) state.expandedFolders.add(res.note.folderId);
                    clearSearch();
                    if (window.innerWidth < 768) toggleMobileSidebar(false);
                });

                DOM.searchResultsList.appendChild(item);
            });
        }

        // ==========================================
        // 6. IMPORT / EXPORT & BACKUP ENGINE
        // ==========================================

        // Single Note .md Export
        DOM.btnExportSingleMd.addEventListener('click', async () => {
            if (!state.activeNoteId) return;
            const note = await db.notes.get(state.activeNoteId);
            if (!note) return;

            const blob = new Blob([note.content], { type: 'text/markdown;charset=utf-8' });
            downloadFile(blob, `${sanitizeFilename(note.title)}.md`);
        });

        // Export Entire Vault as nested ZIP archive
        DOM.btnExportZip.addEventListener('click', async () => {
            const zip = new JSZip();
            const folders = await db.folders.toArray();
            const notes = await db.notes.toArray();

            // Map folder paths
            const folderPaths = new Map();
            
            function buildFolderPath(folderId) {
                if (folderPaths.has(folderId)) return folderPaths.get(folderId);
                const folder = folders.find(f => f.id === folderId);
                if (!folder) return '';
                const parentPath = folder.parentId ? buildFolderPath(folder.parentId) : '';
                const fullPath = parentPath ? `${parentPath}/${sanitizeFilename(folder.name)}` : sanitizeFilename(folder.name);
                folderPaths.set(folderId, fullPath);
                return fullPath;
            }

            folders.forEach(f => buildFolderPath(f.id));

            // Add notes into ZIP folders
            notes.forEach(note => {
                const path = note.folderId ? folderPaths.get(note.folderId) : '';
                const fileName = `${sanitizeFilename(note.title)}.md`;
                const zipPath = path ? `${path}/${fileName}` : fileName;
                zip.file(zipPath, note.content);
            });

            const content = await zip.generateAsync({ type: 'blob' });
            downloadFile(content, `Knowledge_Vault_Backup_${new Date().toISOString().slice(0,10)}.zip`);
        });

        // Export Full JSON Backup
        DOM.btnExportJson.addEventListener('click', async () => {
            const data = {
                version: 1,
                exportedAt: new Date().toISOString(),
                folders: await db.folders.toArray(),
                notes: await db.notes.toArray()
            };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            downloadFile(blob, `Vault_Backup_${new Date().toISOString().slice(0,10)}.json`);
        });

        // Trigger Input File Uploads
        DOM.btnImportFile.addEventListener('click', () => DOM.inputImportMd.click());
        DOM.btnImportZip.addEventListener('click', () => DOM.inputImportZip.click());
        DOM.btnImportJson.addEventListener('click', () => DOM.inputImportJson.click());

        // Import Single .md File
        DOM.inputImportMd.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const text = await file.text();
            const title = file.name.replace(/\.(md|markdown)$/i, '');
            const now = new Date().toISOString();

            const newId = await db.notes.add({
                title: title,
                folderId: state.activeFolderId,
                content: text,
                createdAt: now,
                updatedAt: now
            });

            await refreshKnowledgeTree();
            await openNote(newId);
            e.target.value = '';
        });

        // Import ZIP Archive recursively
        DOM.inputImportZip.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            try {
                const zip = await JSZip.loadAsync(file);
                const now = new Date().toISOString();
                const folderIdCache = new Map();

                // Process files inside zip
                for (const [relativePath, zipEntry] of Object.entries(zip.files)) {
                    if (zipEntry.dir) continue;
                    if (!relativePath.endsWith('.md') && !relativePath.endsWith('.markdown')) continue;

                    const parts = relativePath.split('/');
                    const fileName = parts.pop();
                    const noteTitle = fileName.replace(/\.(md|markdown)$/i, '');
                    const content = await zipEntry.async('text');

                    // Process directory structure
                    let parentId = null;
                    let currentPath = '';

                    for (const folderName of parts) {
                        currentPath = currentPath ? `${currentPath}/${folderName}` : folderName;
                        if (folderIdCache.has(currentPath)) {
                            parentId = folderIdCache.get(currentPath);
                        } else {
                            // Create or fetch folder
                            const existing = await db.folders.where({ name: folderName, parentId: parentId }).first();
                            if (existing) {
                                parentId = existing.id;
                            } else {
                                parentId = await db.folders.add({
                                    name: folderName,
                                    parentId: parentId,
                                    createdAt: now,
                                    updatedAt: now
                                });
                            }
                            folderIdCache.set(currentPath, parentId);
                        }
                    }

                    // Add note
                    await db.notes.add({
                        title: noteTitle,
                        folderId: parentId,
                        content: content,
                        createdAt: now,
                        updatedAt: now
                    });
                }

                await refreshKnowledgeTree();
                alert('ZIP Archive imported successfully!');
            } catch (err) {
                alert('Failed to import ZIP archive: ' + err.message);
            }
            e.target.value = '';
        });

        // Restore JSON Backup
        DOM.inputImportJson.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            try {
                const text = await file.text();
                const data = JSON.parse(text);

                if (data.folders && data.notes) {
                    if (confirm('Restoring JSON backup will replace your current data. Continue?')) {
                        await db.transaction('rw', db.folders, db.notes, async () => {
                            await db.folders.clear();
                            await db.notes.clear();
                            await db.folders.bulkAdd(data.folders);
                            await db.notes.bulkAdd(data.notes);
                        });
                        await refreshKnowledgeTree();
                        showEmptyState();
                        alert('Backup restored successfully!');
                    }
                } else {
                    alert('Invalid backup file format.');
                }
            } catch (err) {
                alert('Error parsing JSON backup: ' + err.message);
            }
            e.target.value = '';
        });

        // Helper Download Utility
        function downloadFile(blob, fileName) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function sanitizeFilename(name) {
            return name.replace(/[/\\?%*:|"<>]/g, '-').trim() || 'Untitled';
        }

        function escapeHtml(str) {
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        // Modal Utility
        function showModal(title, message, onConfirm) {
            DOM.modalTitle.textContent = title;
            DOM.modalMessage.textContent = message;
            DOM.modal.classList.remove('hidden');

            const handleConfirm = () => {
                onConfirm();
                closeModal();
            };

            const closeModal = () => {
                DOM.modal.classList.add('hidden');
                DOM.modalConfirm.removeEventListener('click', handleConfirm);
                DOM.modalCancel.removeEventListener('click', closeModal);
            };

            DOM.modalConfirm.addEventListener('click', handleConfirm);
            DOM.modalCancel.addEventListener('click', closeModal);
        }

        // Keyboard Shortcuts
        document.addEventListener('keydown', (e) => {
            // Ctrl/Cmd + N -> New Note
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'n') {
                e.preventDefault();
                createNewNote();
            }
            // Ctrl/Cmd + Shift + F -> Focus Search
            if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === 'f') {
                e.preventDefault();
                DOM.searchInput.focus();
            }
            // Ctrl/Cmd + S -> Force Save
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
                e.preventDefault();
                saveCurrentNote();
            }
        });

        // ==========================================
        // 7. PWA SERVICE WORKER REGISTRATION
        // ==========================================
        function setupServiceWorker() {
            if ('serviceWorker' in navigator) {
                const swCode = `
                    const CACHE_NAME = 'vault-pwa-v1';
                    self.addEventListener('install', (e) => {
                        self.skipWaiting();
                    });
                    self.addEventListener('activate', (e) => {
                        e.waitUntil(clients.claim());
                    });
                    self.addEventListener('fetch', (e) => {
                        e.respondWith(
                            fetch(e.request).catch(() => caches.match(e.request))
                        );
                    });
                `;
                const blob = new Blob([swCode], { type: 'application/javascript' });
                const swUrl = URL.createObjectURL(blob);
                navigator.serviceWorker.register(swUrl).catch(() => {
                    // Silent fail if inline Blob SW unsupported
                });
            }
        }

        // App Entry Point
        window.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
